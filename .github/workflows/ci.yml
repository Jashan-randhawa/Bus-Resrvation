# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.3', '8.4']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli
          tools: composer

      - name: PHP Syntax Check (lint)
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Composer validate
        run: composer validate --strict

      - name: Block raw request data inside SQL
        run: |
          matches=$(
            grep -RInE '\$_(GET|POST|REQUEST|COOKIE)\[' \
              --include='*.php' \
              --exclude-dir=vendor \
              --exclude-dir=node_modules \
              . \
              | grep -iE 'select |insert |update |delete ' || true
          )
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "Raw request data appears inside a SQL statement."
            echo "Use prepared statements and pass request values as bound parameters."
            exit 1
          fi

      - name: Verify package and vendored assets sync (no drift)
        run: |
          for f in packages/seat-picker/dist/seat-picker.js assets/js/vendor/seat-picker.js \
                   packages/ui/src/theme-toggle.js assets/js/theme-toggle.js; do
            test -f "$f" || { echo "Missing expected file: $f"; exit 1; }
          done
          diff -u packages/seat-picker/dist/seat-picker.js assets/js/vendor/seat-picker.js
          diff -u packages/ui/src/theme-toggle.js assets/js/theme-toggle.js

      - name: Run static admin layout tests
        run: php tests/test_admin_layout.php

