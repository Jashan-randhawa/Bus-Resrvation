<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline - Bus Reservation System</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
background-color: #f8f9fa; color: #212529;
display: flex; align-items: center; justify-content: center;
min-height: 100vh; padding: 24px; text-align: center;
}
.card {
background: #ffffff; max-width: 420px; width: 100%;
padding: 32px 24px; border-radius: 16px;
border: 1px solid #dee2e6; border-top: 5px solid #ffc107;
}
.icon { width: 68px; height: 68px; margin-bottom: 16px; }
h1 { font-size: 20px; margin-bottom: 10px; }
p { font-size: 14px; color: #6c757d; line-height: 1.5; margin-bottom: 20px; }
button {
background: #212529; color: #ffffff; border: none;
padding: 12px 24px; font-size: 14px; font-weight: 600;
border-radius: 8px; cursor: pointer; width: 100%;
}
</style>
</head>
<body>
<div class="card">
<img src="assets/img/app-icon.svg" alt="Bus App Icon" class="icon">
<h1>You're Currently Offline</h1>
<p>Live seat availability, PNR verification, and ticket bookings require an active internet connection.</p>
<button onclick="window.location.reload()">Reconnect & Try Again</button>
</div>
</body>
</html>
