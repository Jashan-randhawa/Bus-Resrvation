# docker/apache-security.conf
ServerTokens Prod
ServerSignature Off
TraceEnable Off

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"
Header always set Strict-Transport-Security "max-age=15552000"

# Content Security Policy (Enforced - Issue 30)
Header always set Content-Security-Policy \
  "default-src 'self'; img-src 'self' data:; \
  script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://code.jquery.com https://unpkg.com; \
  style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com https://unpkg.com; \
  font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; \
  connect-src 'self'; \
  frame-ancestors 'self'; \
  base-uri 'self'; \
  form-action 'self';"

<DirectoryMatch "^/var/www/html/(database|docs|wiki|\.git|\.github)">
  Require all denied
</DirectoryMatch>

<FilesMatch "^(\.env.*|composer\.(json|lock)|Dockerfile)$">
  Require all denied
</FilesMatch>
