<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <defs>
    <!-- Chassis Gradient -->
    <linearGradient id="busBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="45%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <!-- Roof highlight -->
    <linearGradient id="busRoofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <!-- Windshield Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Glass Reflection -->
    <linearGradient id="glareGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Headlight Glow -->
    <linearGradient id="headlightGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <!-- Bumper & Tires -->
    <linearGradient id="darkAccents" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="busShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#busShadow)">
    <!-- Grounding Shadow beneath tires -->
    <ellipse cx="32" cy="57" rx="22" ry="2.8" fill="#0f172a" fill-opacity="0.2"/>

    <!-- Left Tire -->
    <rect x="12" y="47" width="7" height="9" rx="3.5" fill="url(#darkAccents)"/>
    <!-- Right Tire -->
    <rect x="45" y="47" width="7" height="9" rx="3.5" fill="url(#darkAccents)"/>

    <!-- Main Bus Body -->
    <rect x="10" y="7" width="44" height="46" rx="10" fill="url(#busBodyGrad)"/>

    <!-- Roof Aerodynamic Trim -->
    <path d="M12 16 C12 10.5 16.5 7 22 7 L42 7 C47.5 7 52 10.5 52 16 L52 18 L12 18 Z" fill="url(#busRoofGrad)"/>

    <!-- Left Aero Mirror -->
    <rect x="6.5" y="21" width="3.5" height="9" rx="1.75" fill="#1e40af"/>
    <!-- Right Aero Mirror -->
    <rect x="54" y="21" width="3.5" height="9" rx="1.75" fill="#1e40af"/>

    <!-- Top Destination LED Sign -->
    <rect x="20" y="10" width="24" height="5" rx="2.5" fill="#0f172a"/>
    <rect x="23" y="11.5" width="18" height="2" rx="1" fill="#38bdf8" fill-opacity="0.9"/>

    <!-- Front Panoramic Windshield -->
    <rect x="13.5" y="17" width="37" height="19" rx="5" fill="url(#glassGrad)"/>

    <!-- Windshield Reflection Glare -->
    <path d="M14 19 L30 19 L24 35 L14 35 Z" fill="url(#glareGrad)" opacity="0.6"/>

    <!-- Rearview Mirror Mounts -->
    <path d="M10 23 L13.5 24 M54 23 L50.5 24" stroke="#1d4ed8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Wiper Accent -->
    <line x1="20" y1="34" x2="27" y2="30.5" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="37" y1="34" x2="44" y2="30.5" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Chrome Center Transit Brand Logo / Emblem -->
    <circle cx="32" cy="38.5" r="2.2" fill="#ffffff" fill-opacity="0.95"/>
    <circle cx="32" cy="38.5" r="1.3" fill="#2563eb"/>

    <!-- Radiator Grill -->
    <rect x="22" y="41" width="20" height="6.5" rx="3.25" fill="url(#darkAccents)"/>
    <line x1="25" y1="43" x2="39" y2="43" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>
    <line x1="26" y1="45" x2="38" y2="45" stroke="#64748b" stroke-width="1" stroke-linecap="round"/>

    <!-- Left Dual Headlight -->
    <rect x="13" y="39.5" width="6.5" height="4.5" rx="2.25" fill="#ffffff"/>
    <circle cx="15.5" cy="41.75" r="1.5" fill="url(#headlightGlow)"/>

    <!-- Right Dual Headlight -->
    <rect x="44.5" y="39.5" width="6.5" height="4.5" rx="2.25" fill="#ffffff"/>
    <circle cx="48.5" cy="41.75" r="1.5" fill="url(#headlightGlow)"/>

    <!-- Lower Fog Lamps / Turn Signals -->
    <circle cx="15.5" cy="46.5" r="1.2" fill="#f59e0b"/>
    <circle cx="48.5" cy="46.5" r="1.2" fill="#f59e0b"/>

    <!-- Front Lower Bumper -->
    <rect x="11" y="49.5" width="42" height="4" rx="2" fill="url(#darkAccents)"/>
    <rect x="26" y="50.2" width="12" height="2.4" rx="1.2" fill="#475569"/>
  </g>
</svg>