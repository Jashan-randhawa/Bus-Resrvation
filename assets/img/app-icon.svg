<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Bus Body Gradient -->
    <linearGradient id="iconBusBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Windshield Gradient -->
    <linearGradient id="iconGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Headlight Glow -->
    <linearGradient id="iconGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Icon Background Squircle (Maskable Safe) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#60a5fa" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Centered Bus Symbol with Shadow (Safe Zone: 75% center) -->
  <g filter="url(#iconShadow)" transform="translate(100, 86) scale(4.88)">
    <!-- Grounding Shadow beneath tires -->
    <ellipse cx="32" cy="57" rx="22" ry="2.8" fill="#000000" fill-opacity="0.35"/>

    <!-- Left Tire -->
    <rect x="12" y="47" width="7" height="9" rx="3.5" fill="#0f172a"/>
    <!-- Right Tire -->
    <rect x="45" y="47" width="7" height="9" rx="3.5" fill="#0f172a"/>

    <!-- Main Bus Body -->
    <rect x="10" y="7" width="44" height="46" rx="10" fill="url(#iconBusBody)"/>

    <!-- Roof Trim -->
    <path d="M12 16 C12 10.5 16.5 7 22 7 L42 7 C47.5 7 52 10.5 52 16 L52 18 L12 18 Z" fill="#cbd5e1"/>

    <!-- Left Aero Mirror -->
    <rect x="6.5" y="21" width="3.5" height="9" rx="1.75" fill="#94a3b8"/>
    <!-- Right Aero Mirror -->
    <rect x="54" y="21" width="3.5" height="9" rx="1.75" fill="#94a3b8"/>

    <!-- Top Destination LED Sign -->
    <rect x="20" y="10" width="24" height="5" rx="2.5" fill="#0f172a"/>
    <rect x="23" y="11.5" width="18" height="2" rx="1" fill="#38bdf8"/>

    <!-- Front Panoramic Windshield -->
    <rect x="13.5" y="17" width="37" height="19" rx="5" fill="url(#iconGlass)"/>

    <!-- Windshield Reflection Glare -->
    <path d="M14 19 L30 19 L24 35 L14 35 Z" fill="#ffffff" opacity="0.3"/>

    <!-- Mirror Mounts -->
    <path d="M10 23 L13.5 24 M54 23 L50.5 24" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Center Brand Emblem -->
    <circle cx="32" cy="38.5" r="2.2" fill="#2563eb"/>
    <circle cx="32" cy="38.5" r="1.2" fill="#ffffff"/>

    <!-- Radiator Grill -->
    <rect x="22" y="41" width="20" height="6.5" rx="3.25" fill="#0f172a"/>
    <line x1="25" y1="43" x2="39" y2="43" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
    <line x1="26" y1="45" x2="38" y2="45" stroke="#475569" stroke-width="1" stroke-linecap="round"/>

    <!-- Left Headlight -->
    <rect x="13" y="39.5" width="6.5" height="4.5" rx="2.25" fill="#e2e8f0"/>
    <circle cx="15.5" cy="41.75" r="1.5" fill="url(#iconGlow)"/>

    <!-- Right Headlight -->
    <rect x="44.5" y="39.5" width="6.5" height="4.5" rx="2.25" fill="#e2e8f0"/>
    <circle cx="48.5" cy="41.75" r="1.5" fill="url(#iconGlow)"/>

    <!-- Lower Indicators -->
    <circle cx="15.5" cy="46.5" r="1.2" fill="#f59e0b"/>
    <circle cx="48.5" cy="46.5" r="1.2" fill="#f59e0b"/>

    <!-- Front Bumper -->
    <rect x="11" y="49.5" width="42" height="4" rx="2" fill="#1e293b"/>
    <rect x="26" y="50.2" width="12" height="2.4" rx="1.2" fill="#475569"/>
  </g>
</svg>
